<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a5f">
  <title>Nöbetmatik</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>Nöbetmatik</h1>
    <p>Nöbet ve devriye çizelgesi</p>
  </header>

  <main class="layout">
    <form id="form" class="panel" novalidate>
      <section class="card">
        <h2>Görev Saatleri</h2>
        <label class="field">Tarih
          <input type="date" id="date">
        </label>
        <div class="two">
          <label class="field">Başlangıç
            <input type="time" id="start" required>
          </label>
          <label class="field">Bitiş
            <input type="time" id="end" required>
          </label>
        </div>
        <div id="recentTimes" class="chips"></div>
      </section>

      <section class="card">
        <h2>Noktalar ve Güzergâhlar</h2>
        <div class="counter-row">
          <span>Araç noktası <small>(1 kişi)</small></span>
          <div class="counter">
            <button type="button" data-list="points" data-delta="-1" aria-label="Nokta azalt">−</button>
            <output id="pointsCount">1</output>
            <button type="button" data-list="points" data-delta="1" aria-label="Nokta artır">+</button>
          </div>
        </div>
        <div id="pointNames" class="names"></div>

        <div class="counter-row">
          <span>Devriye güzergâhı <small>(2 kişi)</small></span>
          <div class="counter">
            <button type="button" data-list="routes" data-delta="-1" aria-label="Güzergâh azalt">−</button>
            <output id="routesCount">1</output>
            <button type="button" data-list="routes" data-delta="1" aria-label="Güzergâh artır">+</button>
          </div>
        </div>
        <div id="routeNames" class="names"></div>
      </section>

      <section class="card">
        <h2>Personel <span id="peopleCount" class="badge">0</span></h2>
        <textarea id="people" rows="8" placeholder="Her satıra bir isim yazın&#10;Ali Yılmaz&#10;Veli Demir&#10;..."></textarea>
        <p id="peopleHint" class="hint"></p>
        <div class="actions">
          <button type="button" id="shuffle" class="btn secondary">Karıştır</button>
          <button type="button" id="clearPeople" class="btn ghost">Temizle</button>
        </div>
      </section>

      <div id="error" class="error" role="alert" hidden></div>
      <button type="submit" class="btn primary block">Çizelge Oluştur</button>
    </form>

    <section id="result" class="panel">
      <div id="empty" class="card empty">
        <p>Saatleri ve personeli girip <strong>Çizelge Oluştur</strong>'a dokunun.</p>
      </div>

      <div id="output" hidden>
        <div class="card">
          <h2>Çizelge</h2>
          <p id="meta" class="meta"></p>
          <div class="table-wrap">
            <table id="table"></table>
          </div>
          <p id="note" class="hint"></p>
        </div>

        <div class="card">
          <h2>Kişi Özeti</h2>
          <p class="hint">Bir kişiye dokunarak çizelgede görevlerini vurgulayın.</p>
          <ul id="summary" class="summary"></ul>
        </div>

        <div class="share-bar">
          <button type="button" id="whatsapp" class="btn whatsapp">WhatsApp'ta Paylaş</button>
          <button type="button" id="copy" class="btn secondary">Kopyala</button>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
